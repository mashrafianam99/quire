<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Quire</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='3' fill='%230f766e'/%3E%3Cpath d='M11 10h10M11 15h10M11 20h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
<div id="app" class="empty">
  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span>Quire</div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Open documents"></nav>
    <button class="btn" data-open title="Open (Ctrl+O)">Open</button>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Document tools">
    <div class="group">
      <button class="btn primary" id="save" title="Save (Ctrl+S)">Save</button>
      <button class="btn" id="combine" title="Append other PDFs to this one">Combine files</button>
    </div>
    <div class="group tools" aria-label="Edit mode">
      <button class="btn" data-tool="SELECT" aria-pressed="true" title="Select (Esc)">Select</button>
      <button class="btn" data-tool="HIGHLIGHT" aria-pressed="false" title="Highlight text">Highlight</button>
      <button class="btn" data-tool="DRAW" aria-pressed="false" title="Draw or sign">Draw / Sign</button>
      <button class="btn" data-tool="TEXT" aria-pressed="false" title="Add text">Text</button>
      <button class="btn" data-tool="IMAGE" aria-pressed="false" title="Add image">Image</button>
    </div>
    <div class="group">
      <label class="page-nav">
        <span class="sr-only">Page</span>
        <input id="page-num" type="number" min="1" value="1" inputmode="numeric" />
        <span id="page-total">/ 0</span>
      </label>
      <button class="btn icon" id="zoom-out" aria-label="Zoom out">−</button>
      <button class="btn zoom" id="zoom-label" title="Fit width">100%</button>
      <button class="btn icon" id="zoom-in" aria-label="Zoom in">+</button>
    </div>
    <div class="group search">
      <input id="search" type="search" placeholder="Search (Ctrl+F)" aria-label="Search document" />
      <span id="search-count" aria-live="polite"></span>
    </div>
  </div>

  <main class="workspace">
    <aside class="pages-panel" aria-label="Pages">
      <ol id="thumbs" class="thumbs"></ol>
    </aside>
    <div id="viewer" class="viewer"><div class="pdfViewer"></div></div>

    <section class="welcome">
      <div class="welcome-card">
        <div class="welcome-icon" aria-hidden="true"></div>
        <h1>Open a PDF to get started</h1>
        <p>Drop files anywhere, or choose them from your computer.<br />Everything stays on your device.</p>
        <button class="btn primary large" data-open>Choose PDF files</button>
      </div>
    </section>
  </main>

  <div class="drop-overlay" aria-hidden="true"><span>Drop PDFs to open</span></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<input id="open-input" type="file" accept="application/pdf,.pdf" multiple hidden />
<input id="combine-input" type="file" accept="application/pdf,.pdf" multiple hidden />

<dialog id="password-dialog" class="q-dialog">
  <form method="dialog">
    <h2>This PDF is password-protected</h2>
    <p class="dialog-error" hidden>That password didn't work. Try again.</p>
    <label>Password <input type="password" autocomplete="off" autofocus /></label>
    <menu>
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="ok">Open</button>
    </menu>
  </form>
</dialog>
</body>
</html>
